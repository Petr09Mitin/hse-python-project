services:
  postgres:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    environment:
      POSTGRES_USER: receipt
      POSTGRES_PASSWORD: receipt
      POSTGRES_DB: receipt
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receipt -d receipt"]
      interval: 3s
      timeout: 2s
      retries: 20

  app:
    build: .
    environment:
      POSTGRES_DSN: postgresql://receipt:receipt@postgres:5432/receipt
      TELEGRAM_API_KEY: ${TELEGRAM_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-30}
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 40s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "receipt_bot.bootstrap.readiness"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

volumes:
  postgres-data:
